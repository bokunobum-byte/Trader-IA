# render.yaml — Blueprint de deploy do Tarder IA no Render
#
# Uso:
#   1) Suba o projeto no GitHub (com este arquivo no commit)
#   2) Render → New → Blueprint → selecione o repositório
#   3) O Render cria o Web Service automaticamente
#   4) Defina NVIDIA_API_KEY no dashboard (Environment → Add Environment Variable)

services:
  - type: web
    name: tarder-ia
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: true

    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0

    # ✅ Endpoint de health do Streamlit (criado automaticamente pela lib).
    #    O Render consulta este path para saber se o serviço está saudável.
    #    Se não responder 200 em ~30s, o Render considera o deploy falho
    #    e (em runtime) reinicia a instância.
    healthCheckPath: /_stcore/health

    envVars:
      # Chave NVIDIA — preenchida manualmente no dashboard após o primeiro deploy
      - key: NVIDIA_API_KEY
        sync: false

      # Versão explícita do Python (Render usa 3.11.x por padrão)
      - key: PYTHON_VERSION
        value: "3.11.9"

      # Streamlit em modo headless (obrigatório em servidor sem browser)
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"

      # Desativa o prompt de e-mail do Streamlit no primeiro boot
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
